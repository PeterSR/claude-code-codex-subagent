name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: node --check bin/codex-subagent

      - name: Test suite
        run: npm test

      - name: Install round-trip on this platform
        shell: bash
        run: |
          npm pack
          npm install -g "./$(ls *.tgz | head -1)"
          codex-subagent --help > /dev/null
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          codex-subagent install
          test -f "$CLAUDE_CONFIG_DIR/agents/codex.md"
          codex-subagent status
          codex-subagent uninstall
